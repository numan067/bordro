<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordro İçerik Yönetim Paneli</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .login-container, .panel-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            max-width: 900px;
            margin: 20px auto;
        }
        .login-container {
            max-width: 400px;
            margin-top: 100px;
        }
        h2, h3 {
            color: #2d3748;
            border-bottom: 2px solid #5d3ebc;
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #4a5568;
            font-weight: 600;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5d3ebc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #4b319d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #5d3ebc;
            color: white;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #5d3ebc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="loginSection" class="login-container">
        <h2>Yönetim Paneli Giriş</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="kullaniciAdi">Kullanıcı adı</label>
                <input type="text" id="kullaniciAdi" required>
            </div>
            <div class="form-group">
                <label for="parola">Parola</label>
                <input type="password" id="parola" required>
            </div>
            <button type="submit">Giriş yap</button>
        </form>
        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>

    <!-- PANEL EKRANI (Başta Gizlidir, Giriş Yapınca Açılır) -->
    <div id="panelSection" class="panel-container" style="display: none;">
        <div class="top-bar">
            <h2>İçerik Yönetim Paneli</h2>
            <a href="index.html" class="back-link" style="margin-top:0;">← Ana Sayfa</a>
        </div>

        <form id="yonetimForm">
            <!-- DUYURU PANOSU VE FOTOĞRAF DÜZENLEME -->
            <h3>Duyuru Panosu ve Görsel Düzenleme</h3>
            <div class="form-group" style="margin-top: 15
