<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bordro İçerik Yönetim Paneli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #5d3ebc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #4b319d;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #5d3ebc;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Bordro içerik yönetim paneli</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="kullaniciAdi">Kullanıcı adı</label>
                <input type="text" id="kullaniciAdi" required>
            </div>
            <div class="form-group">
                <label for="parola">Parola</label>
                <input type="password" id="parola" required>
            </div>
            <button type="submit" id="girisBtn">Giriş yap</button>
        </form>
        <a href="index.html" class="back-link">← Bordro sayfasına dön</a>
    </div>

    <!-- Firebase ve Giriş Kontrol Scripti -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      // Sizin Firebase Proje Yapılandırmanız
      const firebaseConfig = {
        apiKey: "AIzaSyCo4jvLP_6kSD0RS8tE5_qjNTveTQJGMDI",
        authDomain: "bordroapp.firebaseapp.com",
        projectId: "bordroapp",
        storageBucket: "bordroapp.firebasestorage.app",
        messagingSenderId: "495208822576",
        appId: "1:495208822576:web:1c5b9a8e803ef5fcc7baf5",
        measurementId: "G-6ZRKG9HG9J"
      };

      // Firebase başlatma
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Form gönderildiğinde çalışacak kod
      const form = document.getElementById("loginForm");
      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          
          const kAdi = document.getElementById("kullaniciAdi").value.trim();
          const sifre = document.getElementById("parola").value.trim();

          try {
            // Doğrudan Firebase Firestore 'admins' koleksiyonunda eşleşen kullanıcıyı arıyoruz
            const q = query(
              collection(db, "admins"), 
              where("kullaniciAdi", "==", kAdi), 
              where("sifre", "==", sifre)
            );
            
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
              alert("Giriş başarılı!");
              window.location.href = "panel.html"; // Başarılı girişte yönlendirilecek sayfa
            } else {
              alert("Kullanıcı adı veya parola hatalı!");
            }
          } catch (error) {
            console.error("Giriş hatası:", error);
            alert("Bağlantı hatası: " + error.message);
          }
        });
      }
    </script>
</body>
</html>
