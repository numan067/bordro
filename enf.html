<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enflasyon Takibi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
            border-bottom: 2px solid #d97706;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #d97706;
            color: white;
        }
        td:first-child {
            text-align: left;
        }
        .back-btn {
            display: block;
            text-align: center;
            background-color: #d97706;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #b45309;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ENFLASYON TAKİBİ</h2>
        <table>
            <thead>
                <tr>
                    <th>Ay</th>
                    <th>Aylık TÜFE (%)</th>
                    <th>Birikimli (%)</th>
                </tr>
            </thead>
            <tbody id="enfBody">
                <!-- Firebase'den dinamik olarak yüklenecek -->
            </tbody>
        </table>
        <a href="index.html" class="back-btn">ANA SAYFAYA DÖN</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCo4jvLP_6kSD0RS8tE5_qjNTveTQJGMDI",
          authDomain: "bordroapp.firebaseapp.com",
          projectId: "bordroapp",
          storageBucket: "bordroapp.firebasestorage.app",
          messagingSenderId: "495208822576",
          appId: "1:495208822576:web:1c5b9a8e803ef5fcc7baf5",
          measurementId: "G-6ZRKG9HG9J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const aylar = [
            "Ocak 2026", "Şubat 2026", "Mart 2026", "Nisan 2026", 
            "Mayıs 2026", "Haziran 2026", "Temmuz 2026", "Ağustos 2026", 
            "Eylül 2026", "Ekim 2026", "Kasım 2026", "Aralık 2026"
        ];

        async function enfVerileriniCek() {
            const tbody = document.getElementById("enfBody");
            try {
                const docRef = doc(db, "ayarlar", "veriler");
                const docSnap = await getDoc(docRef);
                let enfData = docSnap.exists() ? docSnap.data().enflasyon || {} : {};

                tbody.innerHTML = "";
                let birikimli = 1;
                let basladi = false;

                aylar.forEach((ay, index) => {
                    let valStr = enfData[index];
                    let aylikVal = (valStr !== undefined && valStr !== "") ? parseFloat(valStr.toString().replace(",", ".")) : NaN;

                    let aylikGosterim = "-";
                    let birikimliGosterim = "-";

                    if (!isNaN(aylikVal)) {
                        aylikGosterim = aylikVal.toFixed(2).replace(".", ",");
                        if (!basladi) {
                            birikimli = 1 + (aylikVal / 100);
                            basladi = true;
                        } else {
                            birikimli = birikimli * (1 + (aylikVal / 100));
                        }
                        let birikimliVal = (birikimli - 1) * 100;
                        birikimliGosterim = birikimliVal.toFixed(2).replace(".", ",");
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td>${ay}</td>
                            <td>${aylikGosterim}</td>
                            <td>${birikimliGosterim}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Veri çekme hatası:", e);
            }
        }

        enfVerileriniCek();
    </script>
</body>
</html>
