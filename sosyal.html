<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sosyal Yardımlar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            text-align: center;
            border-bottom: 2px solid #5d3ebc;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #5d3ebc;
            color: white;
        }
        .back-btn {
            display: block;
            text-align: center;
            background-color: #5d3ebc;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #4b319d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>SOSYAL YARDIMLAR</h2>
        <table>
            <thead>
                <tr>
                    <th>YARDIM ADI</th>
                    <th>2025</th>
                    <th>2026</th>
                </tr>
            </thead>
            <tbody id="sosyalBody">
                <!-- Firebase'den dinamik olarak yüklenecek -->
            </tbody>
        </table>
        <a href="index.html" class="back-btn">ANA SAYFAYA DÖN</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCo4jvLP_6kSD0RS8tE5_qjNTveTQJGMDI",
          authDomain: "bordroapp.firebaseapp.com",
          projectId: "bordroapp",
          storageBucket: "bordroapp.firebasestorage.app",
          messagingSenderId: "495208822576",
          appId: "1:495208822576:web:1c5b9a8e803ef5fcc7baf5",
          measurementId: "G-6ZRKG9HG9J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const sosyalKeys = [
            { id: "servis", adi: "Servis Ücreti" },
            { id: "ram_bayrami", adi: "Ram. Bayramı" },
            { id: "kur_bayrami", adi: "Kur. Bayramı" },
            { id: "yakacak", adi: "Yakacak Yard." },
            { id: "yillik_izin", adi: "Yıllık İzin" },
            { id: "ana_ilkokul", adi: "Ana-İlkokul" },
            { id: "ortaogretim", adi: "Ortaöğretim" },
            { id: "lise", adi: "Lise" },
            { id: "universite", adi: "Üniversite" },
            { id: "evlenme", adi: "Evlenme" },
            { id: "dogum", adi: "Doğum" },
            { id: "olum_kendi", adi: "Ölüm (Kendi)" },
            { id: "olum_yakin", adi: "Ölüm (Yakın)" },
            { id: "gece_zammi", adi: "Gece Zammı Ü." }
        ];

        async function sosyalVerileriCek() {
            const tbody = document.getElementById("sosyalBody");
            try {
                const docRef = doc(db, "ayarlar", "veriler");
                const docSnap = await getDoc(docRef);
                let data = docSnap.exists() ? docSnap.data().sosyal || {} : {};

                tbody.innerHTML = "";
                sosyalKeys.forEach(item => {
                    let v2025 = data[item.id] ? data[item.id]._2025 || "-" : "-";
                    let v2026 = data[item.id] ? data[item.id]._2026 || "-" : "-";
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.adi}</td>
                            <td>${v2025}</td>
                            <td>${v2026}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Veri çekme hatası:", e);
            }
        }

        sosyalVerileriCek();
    </script>
</body>
</html>
