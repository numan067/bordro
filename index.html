<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaş Hesaplama Portalı</title>
    <!-- Sekme İkonu (Favicon) -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            padding-bottom: 90px; /* Alt bar içeriği kapatmasın diye boşluk */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Sol Üst Sabit Logo */
        .top-left-logo {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: white;
            z-index: 1000;
            border: 2px solid #ffffff;
        }

        .portal-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }

        .portal-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 25px 0;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #5d3ebc 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(93, 62, 188, 0.25);
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(93, 62, 188, 0.35);
            background: linear-gradient(135deg, #4b319d 0%, #6d28d9 100%);
        }

        /* Duyuru Panosu */
        .announcement-box {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 16px;
            padding: 18px;
            margin-top: 10px;
            text-align: left;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .announcement-title {
            font-size: 13px;
            font-weight: 700;
            color: #d97706;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
        }

        .announcement-list {
            margin: 0;
            padding-left: 20px;
            font-size: 14px;
            color: #78350f;
            font-weight: 500;
            line-height: 1.5;
        }

        .announcement-list li {
            margin-bottom: 5px;
        }

        .announcement-image-container {
            margin-top: 12px;
            width: 100%;
            max-height: 200px;
            overflow: hidden;
            border-radius: 10px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .announcement-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .admin-link {
            display: inline-block;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .admin-link:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Sabit Alt Navigasyon Barı */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
            box-sizing: border-box;
            border-top: 1px solid #e2e8f0;
        }
        .bottom-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-decoration: none;
            cursor: pointer;
            gap: 3px;
            flex: 1;
            transition: color 0.2s;
        }
        .bottom-btn.active, .bottom-btn:hover {
            color: #5d3ebc;
        }
        .bottom-btn span {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Sol Üst Sabit Logo -->
    <img src="logo.png" alt="Logo" class="top-left-logo">

    <div class="portal-card">
        <div class="portal-header">
            <h1>Maaş Hesaplama Portalı</h1>
        </div>

        <div class="menu-grid">
            <a href="hesapla.html" class="menu-btn">Maaş Hesaplama</a>
            <a href="fark.html" class="menu-btn">Fark Hesaplama</a>
            <a href="sosyal.html" class="menu-btn">Sosyal Haklar</a>
            <a href="enf.html" class="menu-btn">Enflasyon Takibi</a>
        </div>

        <!-- Duyuru Panosu -->
        <div class="announcement-box">
            <div class="announcement-title">
                📢 Duyuru Panosu
            </div>
            <ul id="duyuruListesi" class="announcement-list">
                <li>Yükleniyor...</li>
            </ul>
            <div id="duyuruFotoContainer" class="announcement-image-container">
                <img id="duyuruFoto" src="" alt="Duyuru Görseli">
            </div>
        </div>

        <a href="yonetim.html" class="admin-link">Yönetim Paneli Girişi</a>
    </div>

    <!-- Sabit Alt Navigasyon Barı -->
    <div class="bottom-bar">
        <a href="index.html" class="bottom-btn active">
            <span>🏠</span> Ana Sayfa
        </a>
        <a href="hesapla.html" class="bottom-btn">
            <span>🧮</span> Maaş
        </a>
        <a href="fark.html" class="bottom-btn">
            <span>⚖️</span> Fark
        </a>
        <a href="sosyal.html" class="bottom-btn">
            <span>📋</span> Sosyal
        </a>
        <a href="enf.html" class="bottom-btn">
            <span>📈</span> Enflasyon
        </a>
    </div>

    <!-- Firebase Duyuru ve Fotoğraf Çekme Scripti -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCo4jvLP_6kSD0RS8tE5_qjNTveTQJGMDI",
          authDomain: "bordroapp.firebaseapp.com",
          projectId: "bordroapp",
          storageBucket: "bordroapp.firebasestorage.app",
          messagingSenderId: "495208822576",
          appId: "1:495208822576:web:1c5b9a8e803ef5fcc7baf5",
          measurementId: "G-6ZRKG9HG9J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function duyuruyuGetir() {
            try {
                const docRef = doc(db, "ayarlar", "veriler");
                const docSnap = await getDoc(docRef);
                const listeEl = document.getElementById("duyuruListesi");
                const fotoContainer = document.getElementById("duyuruFotoContainer");
                const fotoImg = document.getElementById("duyuruFoto");

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let satirlar = [];

                    if (data.duyuru1 && data.duyuru1.trim() !== "") satirlar.push(data.duyuru1);
                    if (data.duyuru2 && data.duyuru2.trim() !== "") satirlar.push(data.duyuru2);
                    if (data.duyuru3 && data.duyuru3.trim() !== "") satirlar.push(data.duyuru3);

                    if (satirlar.length > 0) {
                        listeEl.innerHTML = "";
                        satirlar.forEach(metin => {
                            listeEl.innerHTML += `<li>${metin}</li>`;
                        });
                    } else {
                        listeEl.innerHTML = `<li>Şu an aktif bir duyuru bulunmuyor.</li>`;
                    }

                    if (data.duyuruFoto && data.duyuruFoto.trim() !== "") {
                        fotoImg.src = data.duyuruFoto;
                        fotoContainer.style.display = "block";
                    } else {
                        fotoContainer.style.display = "none";
                    }
                } else {
                    listeEl.innerHTML = `<li>Şu an aktif bir duyuru bulunmuyor.</li>`;
                }
            } catch (error) {
                console.error("Duyuru çekilemedi:", error);
                document.getElementById("duyuruListesi").innerHTML = `<li>Duyurular yüklenirken hata oluştu.</li>`;
            }
        }

        duyuruyuGetir();
    </script>
</body>
</html>
