<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BordroApp - Vardiya Çizelgesi (Test 2)</title>
    <style>
        :root {
            --bg-outer: #071326;
            --panel-bg: #0c1f3a;
            --panel-border: rgba(56, 189, 248, 0.28);
            --cell-bg: rgba(15, 36, 68, 0.72);
            --cell-hover: rgba(30, 64, 115, 0.88);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-cyan: #22d3ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background:
                radial-gradient(circle at 20% 15%, rgba(14, 165, 233, 0.22), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.18), transparent 50%),
                var(--bg-outer);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 10px;
        }

        .device-frame {
            width: 100%;
            max-width: 840px;
            background: linear-gradient(165deg, #102a52 0%, var(--panel-bg) 55%, #08172d 100%);
            border: 1.5px solid var(--panel-border);
            border-radius: 22px;
            padding: 16px 18px 20px;
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 36px rgba(34, 211, 238, 0.12);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
            margin-bottom: 12px;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: #ffffff;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
        }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: 0.2px;
            color: #e0f2fe;
        }

        .top-icons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.22);
            color: #e2e8f0;
            height: 32px;
            padding: 0 10px;
            border-radius: 9px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .top-icon-btn.active-mode {
            background: rgba(34, 211, 238, 0.22);
            border-color: var(--accent-cyan);
            color: #ffffff;
        }

        .schedule-heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .schedule-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
        }

        .toolbar-controls {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 14px;
        }

        .ctrl-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .ctrl-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .select-pill, .rate-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #f8fafc;
            border-radius: 8px;
            padding: 7px 8px;
            font-size: 13px;
            font-weight: 700;
            min-width: 0;
        }

        .select-pill:focus, .rate-input:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 14px;
        }

        .weekday-hdr {
            text-align: center;
            font-size: 12.5px;
            font-weight: 700;
            color: #cbd5e1;
            padding: 4px 2px;
        }

        .day-cell {
            background: var(--cell-bg);
            border: 1.5px solid rgba(148, 163, 184, 0.18);
            border-radius: 10px;
            min-height: 70px;
            padding: 5px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 2px;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
            user-select: none;
            min-width: 0;
        }

        .day-cell:hover:not(.empty) {
            background: var(--cell-hover);
            transform: translateY(-1px);
        }

        .day-cell.empty {
            background: rgba(10, 24, 46, 0.35);
            border-color: transparent;
            cursor: default;
        }

        .day-cell.border-tatil {
            border-color: #f43f5e;
        }

        .day-cell.border-izin {
            border-color: #eab308;
        }

        .day-cell.selected {
            box-shadow: 0 0 0 2px var(--accent-cyan);
        }

        .day-number {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            line-height: 1.1;
        }

        .day-cell.has-shift .day-number {
            color: #e2e8f0;
        }

        .shift-pill {
            font-size: 10px;
            font-weight: 800;
            color: #ffffff;
            padding: 2px 6px;
            border-radius: 6px;
            line-height: 1.2;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .pill-v1 {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
        }

        .pill-v2 {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
        }

        .pill-v3 {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        }

        .pill-tatil {
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
        }

        .pill-izin {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #1e293b;
        }

        .mesai-tag {
            font-size: 9px;
            font-weight: 800;
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.16);
            border: 1px solid rgba(52, 211, 153, 0.35);
            border-radius: 5px;
            padding: 1px 4px;
            line-height: 1.15;
            white-space: nowrap;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .summary-card {
            background: rgba(9, 22, 43, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 12px;
            padding: 11px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .summary-icon {
            font-size: 20px;
            line-height: 1;
            flex-shrink: 0;
        }

        .summary-meta {
            min-width: 0;
        }

        .summary-label {
            font-size: 11.5px;
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .summary-value {
            margin-top: 3px;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            white-space: nowrap;
        }

        .editor-bar {
            margin-top: 12px;
            background: rgba(15, 36, 68, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12.5px;
        }

        .editor-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-field {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            color: #e2e8f0;
        }

        .mini-input {
            width: 66px;
            background: rgba(9, 22, 43, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #fff;
            border-radius: 7px;
            padding: 5px 6px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .action-mini-btn {
            background: rgba(34, 211, 238, 0.16);
            border: 1px solid rgba(34, 211, 238, 0.45);
            color: #e0f2fe;
            border-radius: 7px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* MASAÜSTÜ ÖZEL AYARLAR */
        @media (min-width: 641px) {
            body {
                padding: 24px 16px;
            }
            .device-frame {
                padding: 20px 22px 24px;
            }
            .schedule-title {
                font-size: 21px;
            }
            .day-cell {
                min-height: 76px;
                padding: 7px 6px;
            }
            .day-number {
                font-size: 12px;
            }
            .shift-pill {
                font-size: 11px;
                padding: 3px 8px;
            }
            .mesai-tag {
                font-size: 10px;
                padding: 1.5px 6px;
            }
        }

        /* MOBİL ÖZEL AYARLAR (YAZILAR TAM GÖRÜNÜR VE DÜZENLİ) */
        @media (max-width: 640px) {
            body {
                padding: 8px 6px 24px;
                align-items: flex-start;
            }
            .device-frame {
                padding: 10px 8px 14px;
                border-radius: 16px;
            }
            .brand-name {
                font-size: 15px;
            }
            .top-icon-btn {
                height: 30px;
                padding: 0 8px;
                font-size: 11px;
            }
            .schedule-title {
                font-size: 16px;
            }
            .toolbar-controls {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                margin-bottom: 10px;
            }
            .ctrl-label {
                font-size: 11px;
                color: #cbd5e1;
            }
            .select-pill, .rate-input {
                padding: 7px 6px;
                font-size: 12.5px;
            }
            .calendar-grid {
                gap: 3px;
                margin-bottom: 10px;
            }
            .weekday-hdr {
                font-size: 10.5px;
                font-weight: 800;
                padding: 3px 0;
            }
            .day-cell {
                min-height: 64px;
                padding: 4px 1px;
                border-radius: 7px;
                gap: 2px;
            }
            .day-number {
                font-size: 10px;
                color: #cbd5e1;
            }
            .shift-pill {
                font-size: 8.5px;
                padding: 2px 2px;
                border-radius: 4px;
                letter-spacing: -0.3px;
            }
            .mesai-tag {
                font-size: 8px;
                padding: 1px 2px;
                border-radius: 4px;
                letter-spacing: -0.2px;
            }
            .summary-row {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 5px;
            }
            .summary-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 8px 4px;
                gap: 3px;
                border-radius: 10px;
            }
            .summary-icon {
                font-size: 16px;
            }
            .summary-label {
                font-size: 10px;
                color: #e2e8f0;
            }
            .summary-value {
                font-size: 13px;
                margin-top: 1px;
            }
            .editor-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 9px 10px;
                gap: 8px;
                font-size: 12px;
            }
            #seciliGunBilgi {
                font-size: 12px;
                font-weight: 700;
                color: #f8fafc;
            }
            .editor-controls {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }
            .editor-controls > select {
                grid-column: span 2;
                width: 100% !important;
                font-size: 13px !important;
                padding: 7px 8px !important;
            }
            .mini-field {
                justify-content: space-between;
                background: rgba(9, 22, 43, 0.65);
                padding: 4px 7px;
                border-radius: 7px;
                font-size: 11.5px;
            }
            .mini-input {
                width: 58px;
                padding: 4px;
                font-size: 12px;
            }
            .action-mini-btn {
                grid-column: span 2;
                width: 100%;
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <div class="top-bar">
            <div class="brand-wrap">
                <div class="brand-mark">B</div>
                <div class="brand-name">BordroApp</div>
            </div>
            <div class="top-icons">
                <button type="button" id="topluBtn" class="top-icon-btn" onclick="topluSecimModunuDegistir()">☑️ Toplu Seçim: Kapalı</button>
                <button type="button" class="top-icon-btn" title="Profil" onclick="alert('Test 2 vardiya çizelgesi aktif.')">👤</button>
            </div>
        </div>

        <div class="schedule-heading-row">
            <h1 class="schedule-title">
                <span>🗓️</span>
                <span>Vardiya Çizelgesi</span>
            </h1>
        </div>

        <div class="toolbar-controls">
            <div class="ctrl-box">
                <label class="ctrl-label" for="yilSec">Yıl</label>
                <select id="yilSec" class="select-pill" onchange="takvimiCiz()">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <div class="ctrl-box">
                <label class="ctrl-label" for="aySec">Ay</label>
                <select id="aySec" class="select-pill" onchange="takvimiCiz()">
                    <option value="0">Ocak</option>
                    <option value="1">Şubat</option>
                    <option value="2">Mart</option>
                    <option value="3">Nisan</option>
                    <option value="4">Mayıs</option>
                    <option value="5">Haziran</option>
                    <option value="6">Temmuz</option>
                    <option value="7">Ağustos</option>
                    <option value="8">Eylül</option>
                    <option value="9">Ekim</option>
                    <option value="10" selected>Kasım</option>
                    <option value="11">Aralık</option>
                </select>
            </div>
            <div class="ctrl-box">
                <label class="ctrl-label" for="haftaTatiliSec">Hafta Tatili</label>
                <select id="haftaTatiliSec" class="select-pill" onchange="haftaTatiliDegistir()">
                    <option value="none">Seçili Yok</option>
                    <option value="1">Pazartesi</option>
                    <option value="2">Salı</option>
                    <option value="3">Çarşamba</option>
                    <option value="4">Perşembe</option>
                    <option value="5">Cuma</option>
                    <option value="6" selected>Cumartesi</option>
                    <option value="0">Pazar</option>
                </select>
            </div>
            <div class="ctrl-box">
                <label class="ctrl-label" for="saatUcretiInput">Saat Ücreti (TL)</label>
                <input type="number" id="saatUcretiInput" class="rate-input" min="0" step="0.01" placeholder="0.00">
            </div>
        </div>

        <div class="calendar-grid" id="takvimIzgara"></div>

        <div class="summary-row">
            <div class="summary-card">
                <div class="summary-icon">🌙</div>
                <div class="summary-meta">
                    <div class="summary-label">Gece Çalışması</div>
                    <div class="summary-value" id="ozetGece">0 Saat</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">🕒</div>
                <div class="summary-meta">
                    <div class="summary-label">Fazla Mesai</div>
                    <div class="summary-value" id="ozetMesai">0 Saat</div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">📊</div>
                <div class="summary-meta">
                    <div class="summary-label">Toplam Saat</div>
                    <div class="summary-value" id="ozetToplam">0 Saat</div>
                </div>
            </div>
        </div>

        <div class="editor-bar">
            <div id="seciliGunBilgi">1. gün seçili</div>
            <div class="editor-controls">
                <select id="seciliTur" class="select-pill" style="width:auto; padding:4px 8px; font-size:12px;" onchange="seciliGunleriGuncelle()">
                    <option value="v1">1. Vardiya</option>
                    <option value="v2">2. Vardiya</option>
                    <option value="v3">3. Vardiya</option>
                    <option value="tatil">H.Tatili</option>
                    <option value="izin">İzin</option>
                </select>
                <label class="mini-field"><span>Mesai:</span><input type="number" id="seciliMesai" class="mini-input" min="0" step="0.5" value="0" oninput="seciliGunleriGuncelle()"></label>
                <label class="mini-field"><span>Eksik:</span><input type="number" id="seciliEksik" class="mini-input" min="0" step="0.5" value="0" oninput="seciliGunleriGuncelle()"></label>
                <button type="button" class="action-mini-btn" onclick="secimiTemizle()">Seçimi Temizle</button>
            </div>
        </div>
    </div>

    <script>
        const TUR_SIRASI = ["v1", "v2", "v3", "tatil", "izin"];
        const TUR_BILGI = {
            v1: { etiket: "1. Vardiya", sinif: "pill-v1", saat: 7.5, gece: 0 },
            v2: { etiket: "2. Vardiya", sinif: "pill-v2", saat: 7.5, gece: 4 },
            v3: { etiket: "3. Vardiya", sinif: "pill-v3", saat: 7.5, gece: 6 },
            tatil: { etiket: "H.Tatili", sinif: "pill-tatil", saat: 0, gece: 0 },
            izin: { etiket: "İzin", sinif: "pill-izin", saat: 7.5, gece: 0 }
        };

        const kayitlar = {};
        let topluSecimAktif = false;
        let seciliGunler = [1];
        let aktifOdakGun = 1;

        function donemVerisiniGetir(yil, ay) {
            const key = `${yil}-${ay}`;
            if (kayitlar[key]) return kayitlar[key];

            const gunSayisi = new Date(yil, ay + 1, 0).getDate();
            const tatilVal = document.getElementById("haftaTatiliSec").value;
            const tatilGunNo = tatilVal === "none" ? -1 : parseInt(tatilVal, 10);
            const map = {};

            for (let g = 1; g <= gunSayisi; g++) {
                const hGun = new Date(yil, ay, g).getDay();
                let tur = "v1";
                let mesai = 0;

                if (yil === 2026 && ay === 10 && g <= 28) {
                    const desen = {
                        1: "v1", 2: "v1", 3: "v3", 4: "v2", 5: "v1",
                        6: "tatil", 7: "tatil", 8: "v3", 9: "v2", 10: "v1",
                        11: "v1", 12: "v3", 13: "tatil", 14: "tatil", 15: "v2",
                        16: "v1", 17: "v1", 18: "v3", 19: "v2", 20: "tatil",
                        21: "tatil"
                    };
                    tur = desen[g] !== undefined ? desen[g] : null;
                    if ([3, 8, 12, 18].includes(g)) mesai = 6;
                } else if (tatilGunNo !== -1 && hGun === tatilGunNo) {
                    tur = "tatil";
                }

                map[g] = { tur, mesai, eksik: 0 };
            }

            kayitlar[key] = map;
            return map;
        }

        function haftaTatiliDegistir() {
            const val = document.getElementById("haftaTatiliSec").value;
            if (val === "none") {
                takvimiCiz();
                return;
            }
            const tatilGunNo = parseInt(val, 10);
            const yil = parseInt(document.getElementById("yilSec").value, 10);
            const ay = parseInt(document.getElementById("aySec").value, 10);
            const gunSayisi = new Date(yil, ay + 1, 0).getDate();
            const map = donemVerisiniGetir(yil, ay);

            for (let g = 1; g <= gunSayisi; g++) {
                const hGun = new Date(yil, ay, g).getDay();
                const mevcut = map[g] || { tur: null, mesai: 0, eksik: 0 };
                if (hGun === tatilGunNo) {
                    mevcut.tur = "tatil";
                } else if (mevcut.tur === "tatil") {
                    mevcut.tur = "v1";
                }
                map[g] = mevcut;
            }
            takvimiCiz();
        }

        function topluSecimModunuDegistir() {
            topluSecimAktif = !topluSecimAktif;
            const btn = document.getElementById("topluBtn");
            if (topluSecimAktif) {
                btn.classList.add("active-mode");
                btn.textContent = "☑️ Toplu Seçim: Açık";
            } else {
                btn.classList.remove("active-mode");
                btn.textContent = "☑️ Toplu Seçim: Kapalı";
                seciliGunler = [aktifOdakGun];
            }
            takvimiCiz();
        }

        function secimiTemizle() {
            seciliGunler = [aktifOdakGun];
            takvimiCiz();
        }

        function gunTiklandi(gun) {
            const yil = parseInt(document.getElementById("yilSec").value, 10);
            const ay = parseInt(document.getElementById("aySec").value, 10);
            const map = donemVerisiniGetir(yil, ay);
            const mevcut = map[gun] || { tur: null, mesai: 0, eksik: 0 };

            if (topluSecimAktif) {
                aktifOdakGun = gun;
                if (seciliGunler.includes(gun)) {
                    if (seciliGunler.length > 1) {
                        seciliGunler = seciliGunler.filter(x => x !== gun);
                    }
                } else {
                    seciliGunler.push(gun);
                }
            } else {
                if (aktifOdakGun === gun && seciliGunler.length === 1 && seciliGunler[0] === gun) {
                    const idx = mevcut.tur ? TUR_SIRASI.indexOf(mevcut.tur) : -1;
                    mevcut.tur = TUR_SIRASI[(idx + 1) % TUR_SIRASI.length];
                } else {
                    aktifOdakGun = gun;
                    seciliGunler = [gun];
                    if (!mevcut.tur) mevcut.tur = "v1";
                }
                map[gun] = mevcut;
            }

            takvimiCiz();
        }

        function seciliGunleriGuncelle() {
            const yil = parseInt(document.getElementById("yilSec").value, 10);
            const ay = parseInt(document.getElementById("aySec").value, 10);
            const map = donemVerisiniGetir(yil, ay);

            const tur = document.getElementById("seciliTur").value;
            const mesai = Math.max(0, parseFloat(document.getElementById("seciliMesai").value) || 0);
            const eksik = Math.max(0, parseFloat(document.getElementById("seciliEksik").value) || 0);

            seciliGunler.forEach(g => {
                map[g] = { tur, mesai, eksik };
            });

            takvimiCiz();
        }

        function editorSenkronizeEt(map, gunSayisi) {
            if (aktifOdakGun > gunSayisi) aktifOdakGun = 1;
            seciliGunler = seciliGunler.filter(g => g >= 1 && g <= gunSayisi);
            if (seciliGunler.length === 0) seciliGunler = [aktifOdakGun];

            const ayAd = document.getElementById("aySec").selectedOptions[0].text;
            const yil = document.getElementById("yilSec").value;
            const odakVeri = map[aktifOdakGun] || { tur: "v1", mesai: 0, eksik: 0 };

            const bilgiEl = document.getElementById("seciliGunBilgi");
            if (seciliGunler.length > 1) {
                const sirali = [...seciliGunler].sort((a, b) => a - b);
                bilgiEl.textContent = `${sirali.length} gün seçili (${sirali.join(", ")}) — ${ayAd} ${yil}`;
            } else {
                bilgiEl.textContent = `${aktifOdakGun} ${ayAd} ${yil} seçili`;
            }

            document.getElementById("seciliTur").value = odakVeri.tur || "v1";
            document.getElementById("seciliMesai").value = odakVeri.mesai || 0;
            document.getElementById("seciliEksik").value = odakVeri.eksik || 0;
        }

        function takvimiCiz() {
            const yil = parseInt(document.getElementById("yilSec").value, 10);
            const ay = parseInt(document.getElementById("aySec").value, 10);
            const izgara = document.getElementById("takvimIzgara");
            const gunSayisi = new Date(yil, ay + 1, 0).getDate();
            const ilkGunPztIdx = (new Date(yil, ay, 1).getDay() + 6) % 7;
            const map = donemVerisiniGetir(yil, ay);

            izgara.innerHTML = "";
            ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"].forEach(ad => {
                const hdr = document.createElement("div");
                hdr.className = "weekday-hdr";
                hdr.textContent = ad;
                izgara.appendChild(hdr);
            });

            for (let i = 0; i < ilkGunPztIdx; i++) {
                const bos = document.createElement("div");
                bos.className = "day-cell empty";
                izgara.appendChild(bos);
            }

            let toplamGece = 0;
            let toplamMesai = 0;
            let toplamCalisma = 0;

            for (let g = 1; g <= gunSayisi; g++) {
                const d = map[g] || { tur: null, mesai: 0, eksik: 0 };
                const isSelected = seciliGunler.includes(g);

                let borderClass = "";
                if (d.tur === "tatil") borderClass = " border-tatil";
                else if (d.tur === "izin") borderClass = " border-izin";

                const cell = document.createElement("div");
                cell.className =
                    "day-cell" +
                    (d.tur ? " has-shift" : "") +
                    borderClass +
                    (isSelected ? " selected" : "");
                cell.onclick = () => gunTiklandi(g);

                const numEl = document.createElement("div");
                numEl.className = "day-number";
                numEl.textContent = g;
                cell.appendChild(numEl);

                if (d.tur && TUR_BILGI[d.tur]) {
                    const info = TUR_BILGI[d.tur];
                    const pill = document.createElement("div");
                    pill.className = `shift-pill ${info.sinif}`;
                    pill.textContent = info.etiket;
                    cell.appendChild(pill);

                    const gunCalisma = Math.max(0, info.saat - (d.eksik || 0));
                    toplamCalisma += gunCalisma + (d.mesai || 0);
                    toplamGece += info.gece;
                    toplamMesai += (d.mesai || 0);
                } else if ((d.mesai || 0) > 0) {
                    toplamMesai += d.mesai;
                    toplamCalisma += d.mesai;
                }

                if ((d.mesai || 0) > 0) {
                    const mesaiBadge = document.createElement("div");
                    mesaiBadge.className = "mesai-tag";
                    mesaiBadge.textContent = `+${d.mesai}s Mesai`;
                    cell.appendChild(mesaiBadge);
                }

                izgara.appendChild(cell);
            }

            document.getElementById("ozetGece").textContent = `${toplamGece} Saat`;
            document.getElementById("ozetMesai").textContent = `${toplamMesai} Saat`;
            document.getElementById("ozetToplam").textContent = `${toplamCalisma} Saat`;

            editorSenkronizeEt(map, gunSayisi);
        }

        takvimiCiz();
    </script>
</body>
</html>
