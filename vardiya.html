<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vardiya Çizelgesi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #1e293b;
            padding: 15px 10px 40px 10px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        /* ÜST BAR & HESABIM BUTONU */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }
        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .user-name {
            font-weight: 600;
            color: #475569;
        }
        .hesabim-btn {
            color: #dc2626; /* Kırmızı yazı */
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: 1px solid #fecaca;
            background-color: #fef2f2;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
        }
        .hesabim-btn:hover {
            background-color: #fee2e2;
        }

        /* AY VE HAFTA TATİLİ YAN YANA SEÇİM ALANI */
        .controls-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .control-group {
            flex: 1;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }
        .control-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* VARDİYA TABLOSU */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 9px 10px;
            text-align: left;
        }
        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }
        select.vardiya-select {
            width: 100%;
            padding: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 13px;
            background-color: #fff;
        }

        /* HAFTA TATİLİ (KIRMIZI) VE İZİN (SARI) RENKLENDİRMELERİ */
        tr.tatil-row {
            background-color: #fee2e2 !important;
            color: #991b1b;
            font-weight: 600;
        }
        tr.izin-row {
            background-color: #fef08a !important; /* Sarı satır */
            color: #854d0e;
            font-weight: 600;
        }

        /* SARI İZİN KUTUCUĞU */
        .izin-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12.5px;
            color: #854d0e;
            background-color: #fef9c3;
            border: 1.5px solid #eab308;
            padding: 4px 8px;
            border-radius: 6px;
            user-select: none;
        }
        .izin-checkbox {
            accent-color: #eab308; /* Sarı tik rengi */
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* MODAL (HESABIM / BİLGİLERİM PENCERESİ) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-header h3 {
            font-size: 17px;
            color: #0f172a;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13.5px;
        }
        .info-card p {
            margin-bottom: 6px;
        }
        .info-card p:last-child {
            margin-bottom: 0;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #334155;
        }
        .form-group input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13.5px;
        }
        .save-btn {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        .save-btn:hover {
            background-color: #1d4ed8;
        }

        /* HESABIMI SİL BÖLÜMÜ */
        .delete-section {
            margin-top: 22px;
            padding-top: 15px;
            border-top: 1px solid #fee2e2;
            text-align: center;
        }
        .delete-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
        .delete-btn:hover {
            background-color: #b91c1c;
        }
        .confirm-box {
            display: none;
            margin-top: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 8px;
        }
        .confirm-box p {
            font-size: 13px;
            color: #991b1b;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .confirm-actions {
            display: flex;
            gap: 10px;
        }
        .btn-yes {
            flex: 1;
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-no {
            flex: 1;
            background-color: #e2e8f0;
            color: #1e293b;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .status-msg {
            font-size: 12.5px;
            color: #16a34a;
            font-weight: 600;
            margin-top: 8px;
            text-align: center;
        }

        @media (max-width: 520px) {
            .controls-row { flex-direction: row; gap: 8px; }
            th, td { padding: 7px 6px; font-size: 12px; }
            .izin-label { padding: 3px 6px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ÜST BAR -->
    <div class="top-bar">
        <div class="page-title">Vardiya Çizelgesi</div>
        <div class="user-area">
            <span class="user-name" id="headerUserName">Numan Özdemir</span>
            <button class="hesabim-btn" onclick="openAccountModal()">Hesabım</button>
        </div>
    </div>

    <!-- AY SEÇİMİ VE HAFTA TATİLİ GÜNÜ YAN YANA -->
    <div class="controls-row">
        <div class="control-group">
            <label for="aySecimi">Ay Seçimi</label>
            <select id="aySecimi" onchange="onMonthChange()">
                <option value="2026-0">Ocak 2026</option>
                <option value="2026-1">Şubat 2026</option>
                <option value="2026-2">Mart 2026</option>
                <option value="2026-3">Nisan 2026</option>
                <option value="2026-4">Mayıs 2026</option>
                <option value="2026-5">Haziran 2026</option>
                <option value="2026-6">Temmuz 2026</option>
                <option value="2026-7">Ağustos 2026</option>
                <option value="2026-8">Eylül 2026</option>
                <option value="2026-9">Ekim 2026</option>
                <option value="2026-10" selected>Kasım 2026</option>
                <option value="2026-11">Aralık 2026</option>
            </select>
        </div>

        <div class="control-group">
            <label for="tatilSecimi">Hafta Tatili Günü</label>
            <select id="tatilSecimi" onchange="onHolidayChange()">
                <option value="1">Pazartesi</option>
                <option value="2">Salı</option>
                <option value="3">Çarşamba</option>
                <option value="4">Perşembe</option>
                <option value="5">Cuma</option>
                <option value="6">Cumartesi</option>
                <option value="0">Pazar</option>
                <option value="6-0">Cumartesi-Pazar</option>
            </select>
        </div>
    </div>

    <!-- VARDİYA TABLOSU -->
    <table>
        <thead>
            <tr>
                <th>Tarih</th>
                <th>Gün</th>
                <th>Vardiya</th>
                <th style="width: 85px; text-align: center;">İzin</th>
            </tr>
        </thead>
        <tbody id="vardiyaBody">
            <!-- JS ile doldurulacak -->
        </tbody>
    </table>
</div>

<!-- HESABIM / BİLGİLERİM PENCERESİ -->
<div class="modal-overlay" id="accountModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Bilgilerim</h3>
            <button class="close-btn" onclick="closeAccountModal()">&times;</button>
        </div>

        <!-- KULLANICI BİLGİLERİ -->
        <div class="info-card">
            <p><strong>İsim Soyisim:</strong> <span id="infoFullName">Numan Özdemir</span></p>
            <p><strong>E-posta:</strong> <span id="infoEmail">numan@ornek.com</span></p>
        </div>

        <!-- E-POSTA VE ŞİFRE DEĞİŞTİRME -->
        <div class="form-group">
            <label for="newEmail">Yeni E-posta Adresi</label>
            <input type="email" id="newEmail" placeholder="Yeni e-posta adresinizi girin">
        </div>
        <div class="form-group">
            <label for="newPassword">Yeni Şifre</label>
            <input type="password" id="newPassword" placeholder="Yeni şifrenizi girin">
        </div>
        <button class="save-btn" onclick="updateAccountInfo()">Bilgileri Güncelle</button>
        <div class="status-msg" id="accountStatusMsg"></div>

        <!-- EN ALTTA HESABIMI SİL -> EVET / HAYIR -->
        <div class="delete-section">
            <button class="delete-btn" onclick="showDeleteConfirm()">Hesabımı Sil</button>
            
            <div class="confirm-box" id="deleteConfirmBox">
                <p>Hesabınızı kalıcı olarak silmek istediğinize emin misiniz?</p>
                <div class="confirm-actions">
                    <button class="btn-yes" onclick="confirmDeleteAccount()">Evet</button>
                    <button class="btn-no" onclick="hideDeleteConfirm()">Hayır</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const gunIsimleri = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

    // Varsayılan kullanıcı verisi (localStorage'dan okunur)
    let userData = JSON.parse(localStorage.getItem("bordro_user")) || {
        fullName: "Numan Özdemir",
        email: "numan@ornek.com",
        password: "******"
    };

    function syncUserUI() {
        document.getElementById("headerUserName").innerText = userData.fullName;
        document.getElementById("infoFullName").innerText = userData.fullName;
        document.getElementById("infoEmail").innerText = userData.email;
    }

    // Seçili ay için kaydedilmiş hafta tatilini getir
    function loadSavedHolidayForMonth(monthKey) {
        const savedHolidays = JSON.parse(localStorage.getItem("vardiya_holidays")) || {};
        const tatilSelect = document.getElementById("tatilSecimi");
        if (savedHolidays[monthKey] !== undefined) {
            tatilSelect.value = savedHolidays[monthKey];
        } else {
            tatilSelect.value = "0"; // Varsayılan Pazar
        }
    }

    function onMonthChange() {
        const monthKey = document.getElementById("aySecimi").value;
        loadSavedHolidayForMonth(monthKey);
        renderTable();
    }

    function onHolidayChange() {
        const monthKey = document.getElementById("aySecimi").value;
        const selectedHoliday = document.getElementById("tatilSecimi").value;
        
        // O ayın hafta tatili seçimini kalıcı olarak kaydet
        const savedHolidays = JSON.parse(localStorage.getItem("vardiya_holidays")) || {};
        savedHolidays[monthKey] = selectedHoliday;
        localStorage.setItem("vardiya_holidays", JSON.stringify(savedHolidays));

        renderTable();
    }

    function renderTable() {
        const monthKey = document.getElementById("aySecimi").value;
        const [year, month] = monthKey.split("-").map(Number);
        const holidayVal = document.getElementById("tatilSecimi").value;

        const savedLeaves = JSON.parse(localStorage.getItem("vardiya_leaves")) || {};
        const savedShifts = JSON.parse(localStorage.getItem("vardiya_shifts")) || {};

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const tbody = document.getElementById("vardiyaBody");
        tbody.innerHTML = "";

        for (let day = 1; day <= daysInMonth; day++) {
            const dateObj = new Date(year, month, day);
            const dayOfWeek = dateObj.getDay(); // 0: Pazar, 1: Pzt ... 6: Cmt
            const dateStr = `${String(day).padStart(2, "0")}.${String(month + 1).padStart(2, "0")}.${year}`;
            const dayKey = `${monthKey}-${day}`;

            // Hafta tatili kontrolü (Tek gün veya Cumartesi-Pazar)
            let isHoliday = false;
            if (holidayVal === "6-0") {
                isHoliday = (dayOfWeek === 6 || dayOfWeek === 0);
            } else {
                isHoliday = (dayOfWeek === Number(holidayVal));
            }

            // İzin kontrolü
            const isLeave = !!savedLeaves[dayKey];
            const currentShift = savedShifts[dayKey] || (isHoliday ? "Hafta Tatili" : "08:00 - 16:00");

            const tr = document.createElement("tr");
            if (isLeave) {
                tr.classList.add("izin-row"); // İzin seçiliyse sarı
            } else if (isHoliday) {
                tr.classList.add("tatil-row"); // Hafta tatili ise kırmızı
            }

            tr.innerHTML = `
                <td>${dateStr}</td>
                <td>${gunIsimleri[dayOfWeek]}</td>
                <td>
                    <select class="vardiya-select" onchange="saveShift('${dayKey}', this.value)">
                        <option value="08:00 - 16:00" ${currentShift === "08:00 - 16:00" ? "selected" : ""}>08:00 - 16:00 (Gündüz)</option>
                        <option value="16:00 - 24:00" ${currentShift === "16:00 - 24:00" ? "selected" : ""}>16:00 - 24:00 (Akşam)</option>
                        <option value="24:00 - 08:00" ${currentShift === "24:00 - 08:00" ? "selected" : ""}>24:00 - 08:00 (Gece)</option>
                        <option value="Hafta Tatili" ${currentShift === "Hafta Tatili" ? "selected" : ""}>Hafta Tatili</option>
                    </select>
                </td>
                <td style="text-align: center;">
                    <label class="izin-label">
                        <input type="checkbox" class="izin-checkbox" ${isLeave ? "checked" : ""} onchange="toggleLeave('${dayKey}', this.checked)">
                        İzin
                    </label>
                </td>
            `;
            tbody.appendChild(tr);
        }
    }

    function toggleLeave(dayKey, checked) {
        const savedLeaves = JSON.parse(localStorage.getItem("vardiya_leaves")) || {};
        if (checked) {
            savedLeaves[dayKey] = true;
        } else {
            delete savedLeaves[dayKey];
        }
        localStorage.setItem("vardiya_leaves", JSON.stringify(savedLeaves));
        renderTable();
    }

    function saveShift(dayKey, val) {
        const savedShifts = JSON.parse(localStorage.getItem("vardiya_shifts")) || {};
        savedShifts[dayKey] = val;
        localStorage.setItem("vardiya_shifts", JSON.stringify(savedShifts));
    }

    /* HESABIM MODAL İŞLEMLERİ */
    function openAccountModal() {
        document.getElementById("accountStatusMsg").innerText = "";
        document.getElementById("newEmail").value = "";
        document.getElementById("newPassword").value = "";
        hideDeleteConfirm();
        document.getElementById("accountModal").style.display = "flex";
    }

    function closeAccountModal() {
        document.getElementById("accountModal").style.display = "none";
    }

    function updateAccountInfo() {
        const newEmail = document.getElementById("newEmail").value.trim();
        const newPassword = document.getElementById("newPassword").value.trim();
        const statusEl = document.getElementById("accountStatusMsg");

        if (!newEmail && !newPassword) {
            statusEl.style.color = "#dc2626";
            statusEl.innerText = "Lütfen değiştirmek istediğiniz e-posta veya şifreyi girin.";
            return;
        }

        if (newEmail) userData.email = newEmail;
        if (newPassword) userData.password = newPassword;

        localStorage.setItem("bordro_user", JSON.stringify(userData));
        syncUserUI();

        statusEl.style.color = "#16a34a";
        statusEl.innerText = "Bilgileriniz başarıyla güncellendi.";
        document.getElementById("newEmail").value = "";
        document.getElementById("newPassword").value = "";
    }

    function showDeleteConfirm() {
        document.getElementById("deleteConfirmBox").style.display = "block";
    }

    function hideDeleteConfirm() {
        document.getElementById("deleteConfirmBox").style.display = "none";
    }

    function confirmDeleteAccount() {
        localStorage.removeItem("bordro_user");
        localStorage.removeItem("vardiya_holidays");
        localStorage.removeItem("vardiya_leaves");
        localStorage.removeItem("vardiya_shifts");
        alert("Hesabınız ve kayıtlı verileriniz silindi.");
        location.reload();
    }

    // Sayfa ilk açıldığında başlat
    syncUserUI();
    loadSavedHolidayForMonth(document.getElementById("aySecimi").value);
    renderTable();
</script>

</body>
</html>
