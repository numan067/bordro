<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vardiya Çizelgesi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 15px 10px 40px 10px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        /* ÜST BAŞLIK VE KIRMIZI HESABIM YAZISI */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 18px;
        }
        .header-bar h2 {
            font-size: 18px;
            color: #004085;
        }
        .user-info {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hesabim-link {
            color: #dc2626;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        .hesabim-link:hover {
            text-decoration: underline;
        }

        /* AY VE HAFTA TATİLİ YAN YANA */
        .top-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .control-box {
            flex: 1;
        }
        .control-box label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .control-box select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* GÜNLÜK KART / SATIR TASARIMI */
        .day-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .day-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #fff;
            flex-wrap: wrap;
            gap: 8px;
        }
        .day-info {
            font-size: 14px;
            font-weight: bold;
            min-width: 145px;
        }
        .day-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .day-actions select {
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        /* HAFTA TATİLİ (KIRMIZI) VE İZİN (SARI) DURUMLARI */
        .day-card.tatil-aktif {
            background-color: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }
        .day-card.izin-aktif {
            background-color: #fef08a;
            border-color: #eab308;
            color: #854d0e;
        }

        /* KUTUCUKLAR (HAFTA TATİLİ + SARI İZİN) */
        .check-box-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #f8f9fa;
            user-select: none;
        }
        .izin-box-label {
            background-color: #fef9c3;
            border-color: #eab308;
            color: #854d0e;
        }
        .izin-box-label input {
            accent-color: #eab308;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }
        .tatil-box-label input {
            accent-color: #dc2626;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        /* HESABIM / BİLGİLERİM MODAL */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 15px;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .user-details {
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .user-details p {
            margin-bottom: 5px;
        }
        .form-row {
            margin-bottom: 12px;
        }
        .form-row label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .form-row input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-primary {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
        .delete-area {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            text-align: center;
        }
        .btn-danger {
            width: 100%;
            padding: 9px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .confirm-area {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 4px;
        }
        .confirm-area p {
            font-size: 13px;
            color: #991b1b;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .confirm-btns {
            display: flex;
            gap: 8px;
        }
        .confirm-btns button {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes { background: #dc2626; color: #fff; }
        .btn-no { background: #e2e8f0; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <!-- ÜST BAR -->
    <div class="header-bar">
        <h2>Vardiya Çizelgesi</h2>
        <div class="user-info">
            <span id="displayUserName">Numan Özdemir</span>
            <a class="hesabim-link" onclick="openModal()">Hesabım</a>
        </div>
    </div>

    <!-- AY SEÇİMİ VE HAFTA TATİLİ GÜNÜ YAN YANA -->
    <div class="top-controls">
        <div class="control-box">
            <label for="aySec">Ay Seçimi</label>
            <select id="aySec" onchange="ayDegisti()">
                <option value="2026-0">Ocak 2026</option>
                <option value="2026-1">Şubat 2026</option>
                <option value="2026-2">Mart 2026</option>
                <option value="2026-3">Nisan 2026</option>
                <option value="2026-4">Mayıs 2026</option>
                <option value="2026-5">Haziran 2026</option>
                <option value="2026-6">Temmuz 2026</option>
                <option value="2026-7">Ağustos 2026</option>
                <option value="2026-8">Eylül 2026</option>
                <option value="2026-9">Ekim 2026</option>
                <option value="2026-10" selected>Kasım 2026</option>
                <option value="2026-11">Aralık 2026</option>
            </select>
        </div>

        <div class="control-box">
            <label for="tatilGunSec">Hafta Tatili Günü</label>
            <select id="tatilGunSec" onchange="tatilDegisti()">
                <option value="1">Pazartesi</option>
                <option value="2">Salı</option>
                <option value="3">Çarşamba</option>
                <option value="4">Perşembe</option>
                <option value="5">Cuma</option>
                <option value="6">Cumartesi</option>
                <option value="0">Pazar</option>
                <option value="6-0">Cumartesi-Pazar</option>
            </select>
        </div>
    </div>

    <!-- GÜNLER LİSTESİ -->
    <div class="day-list" id="gunListesi"></div>
</div>

<!-- HESABIM / BİLGİLERİM PENCERESİ -->
<div class="modal-bg" id="hesapModal">
    <div class="modal-content">
        <div class="modal-top">
            <h3>Bilgilerim</h3>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>

        <div class="user-details">
            <p><strong>İsim Soyisim:</strong> <span id="modalFullName">Numan Özdemir</span></p>
            <p><strong>E-posta:</strong> <span id="modalEmail">numan@ornek.com</span></p>
        </div>

        <div class="form-row">
            <label>Yeni E-posta</label>
            <input type="email" id="inputEmail" placeholder="Yeni e-posta adresi">
        </div>
        <div class="form-row">
            <label>Yeni Şifre</label>
            <input type="password" id="inputPassword" placeholder="Yeni şifre">
        </div>
        <button class="btn-primary" onclick="bilgileriKaydet()">Değişiklikleri Kaydet</button>
        <p id="kayitMesaj" style="font-size:13px; margin-top:8px; text-align:center; font-weight:bold;"></p>

        <div class="delete-area">
            <button class="btn-danger" onclick="silOnayGoster()">Hesabımı Sil</button>
            <div class="confirm-area" id="silOnayKutusu">
                <p>Hesabınızı silmek istediğinize emin misiniz?</p>
                <div class="confirm-btns">
                    <button class="btn-yes" onclick="hesabiSil()">Evet</button>
                    <button class="btn-no" onclick="silOnayGizle()">Hayır</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

    let kullanici = JSON.parse(localStorage.getItem("vardiya_kullanici")) || {
        adSoyad: "Numan Özdemir",
        eposta: "numan@ornek.com",
        sifre: "123456"
    };

    function kullaniciGuncelleUI() {
        document.getElementById("displayUserName").innerText = kullanici.adSoyad;
        document.getElementById("modalFullName").innerText = kullanici.adSoyad;
        document.getElementById("modalEmail").innerText = kullanici.eposta;
    }

    function kayitliTatiliYukle(ayKey) {
        const kayitliTatiller = JSON.parse(localStorage.getItem("aylik_tatil_secimi")) || {};
        document.getElementById("tatilGunSec").value = kayitliTatiller[ayKey] !== undefined ? kayitliTatiller[ayKey] : "0";
    }

    function ayDegisti() {
        const ayKey = document.getElementById("aySec").value;
        kayitliTatiliYukle(ayKey);
        listeyiOlustur();
    }

    function tatilDegisti() {
        const ayKey = document.getElementById("aySec").value;
        const secilenTatil = document.getElementById("tatilGunSec").value;
        const kayitliTatiller = JSON.parse(localStorage.getItem("aylik_tatil_secimi")) || {};
        kayitliTatiller[ayKey] = secilenTatil;
        localStorage.setItem("aylik_tatil_secimi", JSON.stringify(kayitliTatiller));
        listeyiOlustur();
    }

    function listeyiOlustur() {
        const ayKey = document.getElementById("aySec").value;
        const [yil, ay] = ayKey.split("-").map(Number);
        const tatilDegeri = document.getElementById("tatilGunSec").value;

        const kayitliIzinler = JSON.parse(localStorage.getItem("gunluk_izinler")) || {};
        const kayitliManuelTatiller = JSON.parse(localStorage.getItem("gunluk_manuel_tatil")) || {};
        const kayitliVardiyalar = JSON.parse(localStorage.getItem("gunluk_vardiyalar")) || {};

        const gunSayisi = new Date(yil, ay + 1, 0).getDate();
        const listeAlani = document.getElementById("gunListesi");
        listeAlani.innerHTML = "";

        for (let gun = 1; gun <= gunSayisi; gun++) {
            const tarih = new Date(yil, ay, gun);
            const haftaninGunu = tarih.getDay();
            const tarihMetni = `${String(gun).padStart(2, "0")}.${String(ay + 1).padStart(2, "0")}.${yil}`;
            const gunKey = `${ayKey}-${gun}`;

            let genelTatilMi = false;
            if (tatilDegeri === "6-0") {
                genelTatilMi = (haftaninGunu === 6 || haftaninGunu === 0);
            } else {
                genelTatilMi = (haftaninGunu === Number(tatilDegeri));
            }

            const haftaTatiliIsaretli = kayitliManuelTatiller[gunKey] !== undefined ? kayitliManuelTatiller[gunKey] : genelTatilMi;
            const izinIsaretli = !!kayitliIzinler[gunKey];
            const seciliVardiya = kayitliVardiyalar[gunKey] || "08:00 - 16:00";

            const kart = document.createElement("div");
            kart.className = "day-card";
            if (izinIsaretli) {
                kart.classList.add("izin-aktif");
            } else if (haftaTatiliIsaretli) {
                kart.classList.add("tatil-aktif");
            }

            kart.innerHTML = `
                <div class="day-info">${tarihMetni} - ${gunler[haftaninGunu]}</div>
                <div class="day-actions">
                    <select onchange="vardiyaKaydet('${gunKey}', this.value)">
                        <option value="08:00 - 16:00" ${seciliVardiya === "08:00 - 16:00" ? "selected" : ""}>08:00 - 16:00</option>
                        <option value="16:00 - 24:00" ${seciliVardiya === "16:00 - 24:00" ? "selected" : ""}>16:00 - 24:00</option>
                        <option value="24:00 - 08:00" ${seciliVardiya === "24:00 - 08:00" ? "selected" : ""}>24:00 - 08:00</option>
                    </select>

                    <!-- HAFTA TATİLİ KUTUCUĞU -->
                    <label class="check-box-label tatil-box-label">
                        <input type="checkbox" ${haftaTatiliIsaretli ? "checked" : ""} onchange="haftaTatiliToggle('${gunKey}', this.checked)">
                        Hafta Tatili
                    </label>

                    <!-- YANINDA SARI İZİN KUTUCUĞU -->
                    <label class="check-box-label izin-box-label">
                        <input type="checkbox" ${izinIsaretli ? "checked" : ""} onchange="izinToggle('${gunKey}', this.checked)">
                        İzin
                    </label>
                </div>
            `;
            listeAlani.appendChild(kart);
        }
    }

    function haftaTatiliToggle(gunKey, durum) {
        const kayitliManuelTatiller = JSON.parse(localStorage.getItem("gunluk_manuel_tatil")) || {};
        kayitliManuelTatiller[gunKey] = durum;
        localStorage.setItem("gunluk_manuel_tatil", JSON.stringify(kayitliManuelTatiller));
        listeyiOlustur();
    }

    function izinToggle(gunKey, durum) {
        const kayitliIzinler = JSON.parse(localStorage.getItem("gunluk_izinler")) || {};
        if (durum) {
            kayitliIzinler[gunKey] = true;
        } else {
            delete kayitliIzinler[gunKey];
        }
        localStorage.setItem("gunluk_izinler", JSON.stringify(kayitliIzinler));
        listeyiOlustur();
    }

    function vardiyaKaydet(gunKey, deger) {
        const kayitliVardiyalar = JSON.parse(localStorage.getItem("gunluk_vardiyalar")) || {};
        kayitliVardiyalar[gunKey] = deger;
        localStorage.setItem("gunluk_vardiyalar", JSON.stringify(kayitliVardiyalar));
    }

    /* HESABIM MODAL FONKSİYONLARI */
    function openModal() {
        document.getElementById("kayitMesaj").innerText = "";
        document.getElementById("inputEmail").value = "";
        document.getElementById("inputPassword").value = "";
        silOnayGizle();
        document.getElementById("hesapModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("hesapModal").style.display = "none";
    }

    function bilgileriKaydet() {
        const yeniEposta = document.getElementById("inputEmail").value.trim();
        const yeniSifre = document.getElementById("inputPassword").value.trim();
        const mesaj = document.getElementById("kayitMesaj");

        if (!yeniEposta && !yeniSifre) {
            mesaj.style.color = "#dc2626";
            mesaj.innerText = "Değişiklik için e-posta veya şifre girin.";
            return;
        }

        if (yeniEposta) kullanici.eposta = yeniEposta;
        if (yeniSifre) kullanici.sifre = yeniSifre;

        localStorage.setItem("vardiya_kullanici", JSON.stringify(kullanici));
        kullaniciGuncelleUI();

        mesaj.style.color = "#16a34a";
        mesaj.innerText = "Bilgileriniz güncellendi.";
        document.getElementById("inputEmail").value = "";
        document.getElementById("inputPassword").value = "";
    }

    function silOnayGoster() {
        document.getElementById("silOnayKutusu").style.display = "block";
    }

    function silOnayGizle() {
        document.getElementById("silOnayKutusu").style.display = "none";
    }

    function hesabiSil() {
        localStorage.clear();
        alert("Hesabınız silindi.");
        location.reload();
    }

    kullaniciGuncelleUI();
    kayitliTatiliYukle(document.getElementById("aySec").value);
    listeyiOlustur();
</script>

</body>
</html>
